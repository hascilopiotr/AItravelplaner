[server]
# Only accept connections from this computer. Without this Streamlit listens on
# all network interfaces, so anyone on the same Wi-Fi could use the app (and
# spend API credit on your Anthropic key).
address = "localhost"

[client]
toolbarMode = "minimal"

# "Golden hour atlas": cream paper and navy ink, terracotta for actions,
# saffron for highlights. The sidebar is a navy passport cover.
[theme]
base = "light"
primaryColor = "#C24A2E"
backgroundColor = "#F4ECDD"
secondaryBackgroundColor = "#EADFCB"
textColor = "#1B2A33"
borderColor = "#D9CBB2"
linkColor = "#13435A"
baseRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
font = "Schibsted Grotesk:https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
codeFont = "Martian Mono:https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&display=swap"
headingFontWeights = [400, 400, 400, 400, 400, 400]

[theme.sidebar]
backgroundColor = "#11293A"
secondaryBackgroundColor = "#1B3A4E"
textColor = "#F1E7D3"
primaryColor = "#EDB140"
borderColor = "#2D4C61"
linkColor = "#EDB140"
