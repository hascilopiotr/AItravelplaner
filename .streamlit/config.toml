[server]
# Only accept connections from this computer. Without this Streamlit listens on
# all network interfaces, so anyone on the same Wi-Fi could use the app (and
# spend API credit on your Anthropic key).
address = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
# One main colour: petrol teal. Everything else is paper, ink and teal tints.
primaryColor = "#0F4C5C"
backgroundColor = "#F5F1E8"
secondaryBackgroundColor = "#ECE6DA"
textColor = "#1C2427"
borderColor = "#D6CEBF"
linkColor = "#0F4C5C"
baseRadius = "3px"
showWidgetBorder = true
showSidebarBorder = true
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
