[server]
# Only accept connections from this computer. Without this Streamlit listens on
# all network interfaces, so anyone on the same Wi-Fi could use the app (and
# spend API credit on your Anthropic key).
address = "localhost"

[theme]
base = "light"
primaryColor = "#e74c3c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f4f2"
textColor = "#222222"
