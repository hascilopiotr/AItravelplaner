[server]
# Only accept connections from this computer. Without this Streamlit listens on
# all network interfaces, so anyone on the same Wi-Fi could use the app (and
# spend API credit on your Anthropic key).
address = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#8a2c1c"
backgroundColor = "#faf7f2"
secondaryBackgroundColor = "#f1ebe1"
textColor = "#1e1b17"
borderColor = "#ddd3c4"
linkColor = "#8a2c1c"
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
